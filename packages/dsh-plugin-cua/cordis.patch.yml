# This package's composition layer: the rows it contributes to a profile.
#
# Applied by the plugin manager once the package is installed as a bundle, so
# the rows reach the composition without depending on how a profile resolves
# bare module names.
#
# Computer Use: see and operate the desktop — accessibility trees, screen
# capture, synthesized input, and application control.
#
# The engine is a separate native helper, and the plugin finds the one inside
# this package on its own: `lib/bin/cua-engine/cua-engine.exe` on Windows,
# `lib/bin/cua-engine` on macOS. That is why this row names no path. An absolute
# path cannot be shipped — it is wrong on every machine but the one it was
# written on — and one path could not be right for both platforms anyway, since
# the Windows engine is a directory and the macOS engine is a single file.
#
# macOS only: the Accessibility and Screen Recording grants attach to the process
# responsible for the engine — the application hosting the harness, not
# `cua-engine` — so those are the entries to enable in System Settings.
# `cua_status` reports what is missing and names the application to enable.
- insert:
    - id: cua
      name: '@deepseek-ai/dsh-plugin-cua'
      config:
        # `always` asks before every write. Use `session` to ask once per write
        # tool per session, or `never` if this profile's sessions cannot prompt:
        # a refused approval blocks the action outright, so `never` is the only
        # usable value there.
        writeApproval: always
        idleShutdownMs: 600000

        # Windows only, and off by default: `cua_app` action=script runs a
        # PowerShell snippet, which — unlike a macOS Apple event — is not scoped
        # to any application. Turn it on only for a session that should have it.
        allowedScript: false

        # Where `cua_screenshot` writes its files. Absolute, because the plugin
        # does not expand `~`. Uncomment to move the images away from the
        # default beside the rest of the session state.
        # screenshotDir: /absolute/path/to/cua-screenshots
